aid: daily-harvest
name: Daily Harvest
description: >-
  Daily Harvest is a direct-to-consumer health food delivery company. It sells
  organic, ready-to-prepare frozen foods — smoothies, oat bowls, elixirs,
  protein, and boosters — that customers order on daily-harvest.com (a Shopify
  storefront) and receive shipped frozen to their door, with no subscription
  required. Daily Harvest is a portfolio company of Lightspeed Venture Partners.
  It publishes no first-party developer API; its only public programmatic
  surface is the Shopify Customer Account API OIDC/OAuth2 authorization layer
  exposed at account.daily-harvest.com.
